name: Build Keyball39 firmware

on:
  workflow_dispatch:
  push:
    branches: [keyball39-custom]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QMK_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain and QMK CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          python -m pip install qmk

      - name: Build
        run: qmk compile -kb keyball/keyball39 -km vial

      - uses: actions/upload-artifact@v4
        with:
          name: keyball39-vial
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
